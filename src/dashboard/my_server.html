<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fluffingiously Dragooon - My Servers</title>
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-primary: #090d16;
			--bg-secondary: #0f172a;
			--glass-bg: rgba(15, 23, 42, 0.45);
			--glass-border: rgba(255, 255, 255, 0.06);
			--glass-glow: rgba(99, 102, 241, 0.05);
			--text-primary: #f8fafc;
			--text-secondary: #94a3b8;
			--text-muted: #64748b;
			
			/* Accents */
			--accent-primary: #6366f1; /* Indigo */
			--accent-secondary: #8b5cf6; /* Violet */
			--success: #10b981; /* Emerald */
			--warning: #f59e0b; /* Amber */
			--danger: #ef4444; /* Rose */
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Outfit', sans-serif;
			background-color: var(--bg-primary);
			color: var(--text-primary);
			min-height: 100vh;
			display: flex;
			background-image: 
				radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
				radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
			background-attachment: fixed;
			overflow-x: hidden;
		}



		/* Main container */
		main {
			margin-left: 280px;
			flex-grow: 1;
			padding: 2.5rem;
			max-width: 1200px;
		}

		/* Page Header */
		.page-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 2.5rem;
		}

		.page-title h1 {
			font-size: 1.75rem;
			font-weight: 700;
			letter-spacing: -0.02em;
		}

		.page-title p {
			color: var(--text-secondary);
			font-size: 0.9rem;
			margin-top: 0.25rem;
		}

		/* Section Cards */
		.server-section {
			background: var(--glass-bg);
			border: 1px solid var(--glass-border);
			border-radius: 20px;
			padding: 2rem;
			margin-bottom: 2.5rem;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
		}

		.section-header {
			font-size: 1.1rem;
			font-weight: 700;
			margin-bottom: 1.5rem;
			display: flex;
			align-items: center;
			gap: 0.5rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.05);
			padding-bottom: 0.75rem;
		}

		.section-header span {
			font-size: 1.25rem;
		}

		/* Servers grid */
		.servers-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 1.25rem;
		}

		/* Server card styling */
		.server-card {
			background: rgba(255, 255, 255, 0.02);
			border: 1px solid var(--glass-border);
			border-radius: 16px;
			padding: 1.25rem;
			display: flex;
			align-items: center;
			justify-content: space-between;
			transition: all 0.2s ease;
			gap: 0.75rem;
		}

		.server-card:hover {
			border-color: rgba(99, 102, 241, 0.2);
			background: rgba(255, 255, 255, 0.04);
			transform: translateY(-1px);
		}

		.server-info {
			display: flex;
			align-items: center;
			gap: 0.85rem;
			min-width: 0;
		}

		.server-icon {
			width: 44px;
			height: 44px;
			border-radius: 12px;
			object-fit: cover;
			background: var(--bg-secondary);
			border: 1.5px solid var(--glass-border);
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 700;
			color: var(--text-primary);
			font-size: 1rem;
			flex-shrink: 0;
		}

		.server-details {
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.server-name {
			font-size: 0.95rem;
			font-weight: 600;
			color: var(--text-primary);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.server-status {
			font-size: 0.75rem;
			color: var(--text-muted);
			margin-top: 0.15rem;
		}

		/* Action Buttons */
		.action-btn {
			padding: 0.5rem 0.9rem;
			border-radius: 8px;
			font-size: 0.8rem;
			font-weight: 600;
			text-decoration: none;
			transition: all 0.2s;
			cursor: pointer;
			text-align: center;
			white-space: nowrap;
			flex-shrink: 0;
		}

		.btn-manage {
			background: rgba(16, 185, 129, 0.1);
			border: 1px solid rgba(16, 185, 129, 0.25);
			color: var(--success);
		}

		.btn-manage:hover {
			background: rgba(16, 185, 129, 0.2);
			border-color: rgba(16, 185, 129, 0.4);
		}

		.btn-invite {
			background: rgba(99, 102, 241, 0.1);
			border: 1px solid rgba(99, 102, 241, 0.25);
			color: var(--accent-primary);
		}

		.btn-invite:hover {
			background: rgba(99, 102, 241, 0.2);
			border-color: rgba(99, 102, 241, 0.4);
		}

		.empty-state {
			grid-column: 1 / -1;
			text-align: center;
			padding: 2.5rem;
			color: var(--text-muted);
			font-size: 0.9rem;
		}

		/* Loading Overlay */
		.loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: var(--bg-primary);
			z-index: 10000;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1.5rem;
			transition: opacity 0.5s ease, visibility 0.5s;
		}

		.loading-overlay.hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}

		.spinner {
			width: 40px;
			height: 40px;
			border: 3px solid rgba(99, 102, 241, 0.1);
			border-top-color: var(--accent-primary);
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		/* Modal Overlay */
		.modal-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(4, 6, 15, 0.8);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 1000;
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s ease;
		}

		.modal-overlay.active {
			opacity: 1;
			pointer-events: auto;
		}

		.modal-content {
			background: var(--glass-bg);
			border: 1px solid var(--glass-border);
			border-radius: 24px;
			width: 90%;
			max-width: 400px;
			padding: 2rem;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			transform: scale(0.9);
			transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
		}

		.modal-overlay.active .modal-content {
			transform: scale(1);
		}

		.modal-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 1.5rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.05);
			padding-bottom: 0.75rem;
		}

		.modal-header h3 {
			font-size: 1.2rem;
			font-weight: 700;
			background: linear-gradient(135deg, var(--text-primary) 30%, var(--text-secondary) 100%);
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.close-btn {
			font-size: 1.5rem;
			color: var(--text-muted);
			cursor: pointer;
			transition: color 0.2s;
			line-height: 1;
		}

		.close-btn:hover {
			color: var(--text-primary);
		}

		.profile-preview {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.75rem;
			margin-bottom: 2rem;
			text-align: center;
		}

		.profile-preview img {
			width: 90px;
			height: 90px;
			border-radius: 50%;
			border: 2px solid var(--accent-primary);
			box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
			object-fit: cover;
		}

		.profile-preview h4 {
			font-size: 1.15rem;
			font-weight: 700;
			color: var(--text-primary);
		}

		.modal-rank-soft-text {
			font-size: 0.85rem;
			color: var(--text-muted);
			font-weight: 600;
			opacity: 0.8;
			letter-spacing: 0.02em;
		}

		.form-group {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			margin-bottom: 2rem;
		}

		.form-group label {
			font-size: 0.8rem;
			color: var(--text-secondary);
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.form-group select {
			background: rgba(0, 0, 0, 0.4);
			border: 1px solid var(--glass-border);
			color: var(--text-primary);
			padding: 0.8rem 1rem;
			border-radius: 12px;
			font-family: inherit;
			font-size: 0.9rem;
			outline: none;
			cursor: pointer;
			transition: all 0.3s;
			box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
		}

		.form-group select:focus {
			border-color: var(--accent-primary);
			box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
		}

		.modal-footer {
			display: flex;
			justify-content: flex-end;
			gap: 0.75rem;
			border-top: 1px solid rgba(255, 255, 255, 0.05);
			padding-top: 1.25rem;
		}

		.btn {
			padding: 0.75rem 1.5rem;
			border-radius: 12px;
			font-family: inherit;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s;
			border: 1px solid transparent;
		}

		.btn-secondary {
			background: transparent;
			border-color: var(--glass-border);
			color: var(--text-secondary);
		}

		.btn-secondary:hover {
			background: rgba(255, 255, 255, 0.03);
			color: var(--text-primary);
		}

		.btn-primary {
			background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
			color: #ffffff;
			box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
		}

		.btn-primary:hover {
			transform: translateY(-1px);
			box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
		}

		/* Responsive grid adjustments */
		@media (max-width: 768px) {
			.page-header {
				flex-direction: column;
				align-items: flex-start;
				gap: 1rem;
			}
		}
	</style>
</head>
<body>

	<!-- Loading Screen Overlay -->
	<div id="loadingOverlay" class="loading-overlay">
		<div class="spinner"></div>
		<p id="loadingMessage">Fetching your server integrations...</p>
	</div>

	<!-- INCLUDE_SIDEBAR -->

	<!-- Main Workspace Panel -->
	<main>
		<header class="page-header">
			<div class="page-title">
				<h1>My Servers</h1>
				<p>Manage servers where Fluffingiously Dragooon is present, or invite it to new ones.</p>
			</div>
		</header>

		<!-- Section 1: Active Bot Servers -->
		<section class="server-section">
			<div class="section-header">
				<span>🟢</span>
				<h3>Manage My Servers</h3>
			</div>
			<div id="managedGuildsContainer" class="servers-grid">
				<!-- Injected by JS -->
			</div>
		</section>

		<!-- Section 2: Invite Bot Servers -->
		<section class="server-section">
			<div class="section-header">
				<span>🔵</span>
				<h3>Invite Bot to Server</h3>
			</div>
			<div id="inviteGuildsContainer" class="servers-grid">
				<!-- Injected by JS -->
			</div>
		</section>
	</main>

	<!-- Settings Dialog Overlay -->
	<div id="profileModal" class="modal-overlay" onclick="closeProfileModal(event)">
		<div class="modal-content" onclick="event.stopPropagation()">
			<div class="modal-header">
				<h3>Profile Settings</h3>
				<span class="close-btn" onclick="toggleModal(false)">&times;</span>
			</div>
			<div class="modal-body">
				<div class="profile-preview">
					<img id="modalAvatar" src="" alt="Avatar">
					<h4 id="modalUsername">Username</h4>
					<p id="modalRankText" class="modal-rank-soft-text"></p>
				</div>
				<div class="form-group">
					<label for="rankSelect">Choose Display Rank</label>
					<select id="rankSelect" onchange="previewRankChange()">
						<!-- Options loaded dynamically -->
					</select>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-secondary" onclick="toggleModal(false)">Cancel</button>
				<button class="btn btn-primary" onclick="saveProfileConfig()">Save Changes</button>
			</div>
		</div>
	</div>

	<script>
		window.currentUser = null;

		const RANK_LABELS = {
			"bot dev": "bot dev",
			"den boundless resident": "den boundless resident",
			"den disciple echoing": "den disciple echoing",
			"den journeyer": "den journeyer",
			"den member": "den member",
			"member": "member"
		};

		// Helper to extract initials for servers without icons
		function getInitials(name) {
			return name
				.split(' ')
				.map(word => word.charAt(0))
				.join('')
				.substring(0, 3)
				.toUpperCase();
		}

		// Close loader
		function hideLoader() {
			const overlay = document.getElementById('loadingOverlay');
			if (overlay) overlay.classList.add('hidden');
		}

		// Update user info and page details
		async function loadUserProfile() {
			try {
				const res = await fetch('/api/status');
				if (!res.ok) throw new Error();
				const data = await res.json();

				if (!data.user) {
					// Session expired or logged out - send back to login/dashboard
					window.location.href = '/dashboard';
					return;
				}

				window.currentUser = data.user;

				// Update bot info header in sidebar
				if (data.bot) {
					document.getElementById('botAvatar').src = data.bot.avatarUrl || 'https://cdn.discordapp.com/embed/avatars/0.png';
					document.getElementById('botTagName').textContent = data.bot.username || 'Fluffingiously';
					document.getElementById('sidebarStatusDot').className = `status-dot ${data.bot.status === 'online' ? 'online' : 'offline'}`;
				}

				// Sidebar Profile Card
				const profileSection = document.getElementById('userProfileSection');
				const rankText = data.user.rankText ? ` <span class="rank-soft-text">${data.user.rankText}</span>` : '';
				
				profileSection.innerHTML = `
					<div class="user-card">
						<div class="user-details" onclick="openProfileModal()" style="cursor: pointer;">
							<img src="${data.user.avatarUrl}" alt="User Avatar" class="user-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
							<span class="user-name" title="${data.user.username}">${data.user.username}${rankText}</span>
						</div>
						<a href="/api/auth/logout" class="logout-btn" title="Logout" onclick="event.stopPropagation()">
							<svg style="width:16px;height:18px;fill:currentColor;" viewBox="0 0 24 24">
								<path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/>
							</svg>
						</a>
					</div>
				`;

				// Show admin links if qualified
				const adminOnlyItems = document.querySelectorAll('.admin-only');
				if (data.user.isAdmin) {
					adminOnlyItems.forEach(el => el.style.display = 'block');
				} else {
					adminOnlyItems.forEach(el => el.style.display = 'none');
				}

			} catch (e) {
				console.error('[MyServer] Failed to load session status:', e);
				window.location.href = '/dashboard';
			}
		}

		// Fetch and render guilds list
		async function loadServers() {
			try {
				const res = await fetch('/api/user/guilds');
				if (!res.ok) throw new Error('API server returned error: ' + res.status);
				const data = await res.json();

				const managedContainer = document.getElementById('managedGuildsContainer');
				const inviteContainer = document.getElementById('inviteGuildsContainer');

				// Render Managed servers (where bot is present)
				managedContainer.innerHTML = '';
				if (data.managed && data.managed.length > 0) {
					data.managed.forEach(guild => {
						const iconHtml = guild.iconUrl 
							? `<img src="${guild.iconUrl}" alt="${guild.name}" class="server-icon" onerror="this.outerHTML='<div class=&quot;server-icon&quot;>${getInitials(guild.name)}</div>'">`
							: `<div class="server-icon">${getInitials(guild.name)}</div>`;

						managedContainer.innerHTML += `
							<div class="server-card">
								<div class="server-info">
									${iconHtml}
									<div class="server-details">
										<span class="server-name" title="${guild.name}">${guild.name}</span>
										<span class="server-status">Bot is online</span>
									</div>
								</div>
								<a href="/dashboard" class="action-btn btn-manage">Manage</a>
							</div>
						`;
					});
				} else {
					managedContainer.innerHTML = `<div class="empty-state">No servers found where the bot is active.</div>`;
				}

				// Render Inviteable servers
				inviteContainer.innerHTML = '';
				if (data.inviteable && data.inviteable.length > 0) {
					data.inviteable.forEach(guild => {
						const iconHtml = guild.iconUrl 
							? `<img src="${guild.iconUrl}" alt="${guild.name}" class="server-icon" onerror="this.outerHTML='<div class=&quot;server-icon&quot;>${getInitials(guild.name)}</div>'">`
							: `<div class="server-icon">${getInitials(guild.name)}</div>`;

						inviteContainer.innerHTML += `
							<div class="server-card">
								<div class="server-info">
									${iconHtml}
									<div class="server-details">
										<span class="server-name" title="${guild.name}">${guild.name}</span>
										<span class="server-status">Permission available</span>
									</div>
								</div>
								<a href="${guild.inviteUrl}" target="_blank" class="action-btn btn-invite">Invite Bot</a>
							</div>
						`;
					});
				} else {
					inviteContainer.innerHTML = `<div class="empty-state">No servers found where you have Manage Server permissions.</div>`;
				}

			} catch (e) {
				console.error('[MyServer] Failed to load servers list:', e);
				document.getElementById('managedGuildsContainer').innerHTML = `<div class="empty-state" style="color:var(--danger);">Error loading server lists: ${e.message}</div>`;
				document.getElementById('inviteGuildsContainer').innerHTML = `<div class="empty-state" style="color:var(--danger);">Error loading server lists: ${e.message}</div>`;
			} finally {
				hideLoader();
			}
		}

		// Modal Controls for Profile Settings
		function toggleModal(show) {
			const modal = document.getElementById('profileModal');
			if (show) {
				modal.classList.add('active');
			} else {
				modal.classList.remove('active');
			}
		}

		function openProfileModal() {
			const user = window.currentUser;
			if (!user) return;

			document.getElementById('modalAvatar').src = user.avatarUrl;
			document.getElementById('modalUsername').textContent = user.username;
			document.getElementById('modalRankText').textContent = user.rankText || 'No custom rank active';

			// Populate select
			const select = document.getElementById('rankSelect');
			select.innerHTML = '<option value="">None (Empty)</option>';

			if (user.eligibleRanks && user.eligibleRanks.length > 0) {
				user.eligibleRanks.forEach(rank => {
					const opt = document.createElement('option');
					opt.value = rank;
					opt.textContent = RANK_LABELS[rank] || rank;
					if (rank === user.displayRank) {
						opt.selected = true;
					}
					select.appendChild(opt);
				});
			} else {
				const opt = document.createElement('option');
				opt.value = "";
				opt.textContent = "No eligible ranks";
				opt.disabled = true;
				select.appendChild(opt);
			}

			toggleModal(true);
		}

		function closeProfileModal(event) {
			if (event && event.target === document.getElementById('profileModal')) {
				toggleModal(false);
			}
		}

		function previewRankChange() {
			const select = document.getElementById('rankSelect');
			const chosen = select.value;
			const rankTextPreview = chosen ? (RANK_LABELS[chosen] || '') : 'None (Empty)';
			document.getElementById('modalRankText').textContent = rankTextPreview;
		}

		async function saveProfileConfig() {
			const select = document.getElementById('rankSelect');
			const chosenRank = select.value;

			try {
				const res = await fetch('/api/user/config', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({ displayRank: chosenRank })
				});

				if (!res.ok) {
					throw new Error('Failed to save settings');
				}

				toggleModal(false);
				
				// Reload profile changes immediately
				await loadUserProfile();
				await loadServers();
			} catch (e) {
				alert('Error saving rank choice: ' + e.message);
			}
		}

		// Boot setup
		(async function init() {
			await loadUserProfile();
