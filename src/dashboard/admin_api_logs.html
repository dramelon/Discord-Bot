<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fluffingiously Dragooon - API logs</title>
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-primary: #090d16;
			--bg-secondary: #0f172a;
			--glass-bg: rgba(15, 23, 42, 0.45);
			--glass-border: rgba(255, 255, 255, 0.06);
			--glass-glow: rgba(99, 102, 241, 0.05);
			--text-primary: #f8fafc;
			--text-secondary: #94a3b8;
			--text-muted: #64748b;
			
			/* Accents */
			--accent-primary: #6366f1; /* Indigo */
			--accent-secondary: #8b5cf6; /* Violet */
			--success: #10b981; /* Emerald */
			--warning: #f59e0b; /* Amber */
			--danger: #ef4444; /* Rose */
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Outfit', sans-serif;
			background-color: var(--bg-primary);
			color: var(--text-primary);
			min-height: 100vh;
			display: flex;
			background-image: 
				radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
				radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
			background-attachment: fixed;
			overflow-x: hidden;
		}

		/* Main container */
		main {
			margin-left: 280px;
			flex-grow: 1;
			padding: 2.5rem;
			max-width: 1200px;
			display: flex;
			flex-direction: column;
		}

		/* Page Header */
		.page-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 2rem;
		}

		.page-title h1 {
			font-size: 1.75rem;
			font-weight: 700;
			letter-spacing: -0.02em;
		}

		.page-title p {
			color: var(--text-secondary);
			font-size: 0.9rem;
			margin-top: 0.25rem;
		}

		/* Filters Card */
		.filter-card {
			background: var(--glass-bg);
			border: 1px solid var(--glass-border);
			border-radius: 20px;
			padding: 1.5rem;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
			margin-bottom: 1.5rem;
		}

		.filter-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 1rem;
			align-items: flex-end;
		}

		.filter-group {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.filter-group label {
			font-size: 0.75rem;
			color: var(--text-secondary);
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.filter-input {
			background: rgba(0, 0, 0, 0.3);
			border: 1px solid var(--glass-border);
			padding: 0.6rem 0.8rem;
			border-radius: 8px;
			color: var(--text-primary);
			font-family: inherit;
			font-size: 0.85rem;
			outline: none;
			transition: all 0.3s;
		}

		.filter-input:focus {
			border-color: var(--accent-primary);
		}

		select.filter-input {
			cursor: pointer;
		}

		.btn-filter {
			background: rgba(99, 102, 241, 0.1);
			border: 1px solid rgba(99, 102, 241, 0.25);
			color: #a5b4fc;
			padding: 0.6rem 1rem;
			border-radius: 8px;
			font-family: inherit;
			font-weight: 600;
			font-size: 0.85rem;
			cursor: pointer;
			transition: all 0.2s;
			text-align: center;
		}

		.btn-filter:hover {
			background: rgba(99, 102, 241, 0.2);
			border-color: var(--accent-primary);
			color: var(--text-primary);
		}

		/* Logs Card */
		.logs-card {
			background: var(--glass-bg);
			border: 1px solid var(--glass-border);
			border-radius: 20px;
			padding: 1.5rem;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
			flex-grow: 1;
			display: flex;
			flex-direction: column;
		}

		.logs-console {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			margin-top: 1rem;
			flex-grow: 1;
			max-height: 600px;
			overflow-y: auto;
			padding-right: 0.5rem;
		}

		.logs-console::-webkit-scrollbar {
			width: 6px;
		}

		.logs-console::-webkit-scrollbar-track {
			background: transparent;
		}

		.logs-console::-webkit-scrollbar-thumb {
			background: rgba(255, 255, 255, 0.08);
			border-radius: 4px;
		}

		.logs-console::-webkit-scrollbar-thumb:hover {
			background: rgba(255, 255, 255, 0.15);
		}

		.log-row-container {
			display: flex;
			flex-direction: column;
			gap: 0.25rem;
		}

		.log-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0.6rem 1rem;
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.02);
			border-left: 3px solid var(--text-muted);
			cursor: pointer;
			transition: all 0.2s;
		}

		.log-row:hover {
			background: rgba(255, 255, 255, 0.05);
		}

		.log-row.discord { border-left-color: var(--accent-primary); }
		.log-row.dashboard { border-left-color: var(--accent-secondary); }
		.log-row.external { border-left-color: var(--success); }
		.log-row.incoming { border-left-color: #06b6d4; }
		.log-row.ratelimit {
			border-left-color: var(--danger);
			background: rgba(239, 68, 68, 0.05);
		}

		.log-left {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.log-badge {
			padding: 0.2rem 0.5rem;
			border-radius: 4px;
			font-size: 0.7rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.badge-method-get { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
		.badge-method-post { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.2); }
		.badge-method-put { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.2); }
		.badge-method-delete { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); }
		.badge-method-any { background: rgba(255, 255, 255, 0.1); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.15); }

		.badge-type {
			background: rgba(255, 255, 255, 0.05);
			color: var(--text-secondary);
			border: 1px solid rgba(255, 255, 255, 0.08);
		}

		.log-path {
			font-family: 'Fira Code', monospace;
			font-size: 0.8rem;
			color: #e2e8f0;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.log-right {
			display: flex;
			align-items: center;
			gap: 1rem;
		}

		.badge-status {
			padding: 0.2rem 0.5rem;
			border-radius: 4px;
			font-size: 0.75rem;
			font-weight: 600;
		}

		.status-success { background: rgba(16, 185, 129, 0.15); color: #34d399; }
		.status-warning { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
		.status-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
		.status-pending { background: rgba(255, 255, 255, 0.08); color: var(--text-secondary); }

		.log-latency {
			font-size: 0.8rem;
			color: var(--text-secondary);
		}

		.log-time {
			font-size: 0.8rem;
			color: var(--text-muted);
		}

		/* Log details drawer */
		.log-details {
			padding: 1rem;
			background: rgba(0, 0, 0, 0.35);
			border: 1px solid var(--glass-border);
			border-top: none;
			border-radius: 0 0 8px 8px;
			font-size: 0.8rem;
			font-family: 'Fira Code', monospace;
			animation: slideDown 0.2s ease-out;
		}

		@keyframes slideDown {
			from { opacity: 0; transform: translateY(-5px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.details-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 1rem;
		}

		@media (max-width: 768px) {
			.details-grid {
				grid-template-columns: 1fr;
			}
		}

		.details-section-title {
			color: var(--accent-primary);
			font-weight: 600;
			margin-bottom: 0.5rem;
			font-size: 0.85rem;
			border-bottom: 1px solid rgba(255,255,255,0.05);
			padding-bottom: 0.25rem;
		}

		.details-headers-box {
			max-height: 200px;
			overflow-y: auto;
			background: rgba(0, 0, 0, 0.4);
			padding: 0.5rem 0.75rem;
			border-radius: 6px;
			border: 1px solid rgba(255, 255, 255, 0.03);
			line-height: 1.5;
		}

		.header-line {
			word-break: break-all;
			margin-bottom: 0.25rem;
		}

		.header-key {
			color: #a5b4fc;
		}

		.header-val {
			color: #e2e8f0;
		}

		.empty-placeholder {
			color: var(--text-muted);
			font-style: italic;
			text-align: center;
			padding: 3rem;
		}

		/* Pagination styles */
		.pagination-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-top: 1.5rem;
			border-top: 1px solid rgba(255, 255, 255, 0.05);
			padding-top: 1.25rem;
		}

		.pagination-info {
			font-size: 0.85rem;
			color: var(--text-secondary);
		}

		.pagination-buttons {
			display: flex;
			gap: 0.5rem;
		}

		.btn-nav {
			background: var(--glass-bg);
			border: 1px solid var(--glass-border);
			padding: 0.45rem 1rem;
			border-radius: 8px;
			color: var(--text-primary);
			font-family: inherit;
			font-size: 0.85rem;
			cursor: pointer;
			transition: all 0.2s;
		}

		.btn-nav:hover:not(:disabled) {
			border-color: var(--accent-primary);
			background: rgba(99, 102, 241, 0.08);
		}

		.btn-nav:disabled {
			opacity: 0.35;
			cursor: not-allowed;
		}

		/* Modal overlay and settings details - matching admin_panel.html */
		.modal-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(2, 4, 8, 0.8);
			backdrop-filter: blur(10px);
			z-index: 1000;
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s ease;
		}

		.modal-overlay.active {
			opacity: 1;
			pointer-events: auto;
		}

		.modal-content {
			background: #0b0f19;
			border: 1px solid var(--glass-border);
			border-radius: 24px;
			width: 90%;
			max-width: 440px;
			padding: 2rem;
			box-shadow: 0 20px 50px rgba(0,0,0,0.5);
			transform: scale(0.9);
			transition: transform 0.3s ease;
		}

		.modal-overlay.active .modal-content {
			transform: scale(1);
		}

		.modal-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 1.5rem;
		}

		.close-btn {
			font-size: 1.5rem;
			cursor: pointer;
			color: var(--text-secondary);
			transition: color 0.2s;
		}

		.close-btn:hover {
			color: var(--text-primary);
		}

		.profile-preview {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.75rem;
			margin-bottom: 1.5rem;
		}

		.profile-preview img {
			width: 80px;
			height: 80px;
			border-radius: 50%;
			border: 3px solid var(--accent-primary);
		}

		.modal-rank-soft-text {
			font-size: 0.85rem;
			color: var(--text-secondary);
		}

		.form-group-modal {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			margin-bottom: 1.5rem;
		}

		.form-group-modal label {
			font-size: 0.75rem;
			color: var(--text-secondary);
			font-weight: 600;
			text-transform: uppercase;
		}

		.form-group-modal select {
			background: rgba(0,0,0,0.3);
			border: 1px solid var(--glass-border);
			padding: 0.8rem;
			border-radius: 12px;
			color: var(--text-primary);
			font-family: inherit;
			outline: none;
		}

		.modal-footer {
			display: flex;
			justify-content: flex-end;
			gap: 0.75rem;
		}

		.btn {
			padding: 0.6rem 1.2rem;
			border-radius: 10px;
			font-family: inherit;
			font-weight: 600;
			font-size: 0.85rem;
			cursor: pointer;
			border: 1px solid transparent;
		}

		.btn-primary {
			background: var(--accent-primary);
			color: var(--text-primary);
		}

		.btn-secondary {
			background: transparent;
			border-color: var(--glass-border);
			color: var(--text-secondary);
		}

		.btn-secondary:hover {
			color: var(--text-primary);
			background: rgba(255,255,255,0.02);
		}

		/* Loading Overlay */
		.loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: var(--bg-primary);
			z-index: 9999;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			transition: opacity 0.5s ease, visibility 0.5s ease;
		}

		.loading-overlay.hidden {
			opacity: 0;
			visibility: hidden;
		}

		.spinner {
			width: 50px;
			height: 50px;
			border: 3px solid rgba(99, 102, 241, 0.1);
			border-top-color: var(--accent-primary);
			border-radius: 50%;
			animation: spin 1s infinite linear;
			margin-bottom: 1rem;
		}

		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		.loading-text {
			font-size: 1rem;
			font-weight: 500;
			color: var(--text-secondary);
			letter-spacing: 0.05em;
		}
	</style>
</head>
<body>

	<!-- Loading Screen Overlay -->
	<div class="loading-overlay" id="loadingOverlay">
		<div class="spinner"></div>
		<div class="loading-text">Synchronizing API Logs...</div>
	</div>

	<!-- INCLUDE_SIDEBAR -->

	<main>
		<!-- Page Header -->
		<div class="page-header">
			<div class="page-title">
				<h1>API Request Logs</h1>
				<p>Historical archive of all inbound and outbound bot HTTP requests.</p>
			</div>
			<button class="btn-filter" style="display: flex; align-items: center; gap: 0.35rem;" onclick="refreshLogs()">
				<span>🔄</span> Reload Logs
			</button>
		</div>

		<!-- Filters Panel -->
		<div class="filter-card">
			<div class="filter-grid">
				<!-- Filter by Type -->
				<div class="filter-group">
					<label for="filterType">Request Type</label>
					<select id="filterType" class="filter-input" onchange="onFilterChange()">
						<option value="">All Types</option>
						<option value="incoming">Incoming (Web Server)</option>
						<option value="discord">Discord Client REST</option>
						<option value="dashboard">Dashboard (OAuth Fetch)</option>
						<option value="external">External (Third-party)</option>
						<option value="ratelimit">Rate Limit Encounters</option>
					</select>
				</div>

				<!-- Filter by Method -->
				<div class="filter-group">
					<label for="filterMethod">HTTP Method</label>
					<select id="filterMethod" class="filter-input" onchange="onFilterChange()">
						<option value="">All Methods</option>
						<option value="GET">GET</option>
						<option value="POST">POST</option>
						<option value="PUT">PUT</option>
						<option value="DELETE">DELETE</option>
					</select>
				</div>

				<!-- Filter by Status -->
				<div class="filter-group">
					<label for="filterStatus">Status Code</label>
					<select id="filterStatus" class="filter-input" onchange="onFilterChange()">
						<option value="">All Statuses</option>
						<option value="2xx">2xx (Success)</option>
						<option value="3xx">3xx (Redirect)</option>
						<option value="4xx">4xx (Client Error)</option>
						<option value="5xx">5xx (Server Error)</option>
						<option value="429">429 (Rate Limited)</option>
						<option value="200">200 (OK)</option>
						<option value="404">404 (Not Found)</option>
						<option value="Failed">Failed (Network Failure)</option>
					</select>
				</div>

				<!-- Search Input -->
				<div class="filter-group" style="flex-grow: 2;">
					<label for="searchQuery">Search Log Details</label>
					<input type="text" id="searchQuery" class="filter-input" placeholder="Search path, IP, or error message..." oninput="onSearchInput()">
				</div>
			</div>
		</div>

		<!-- Logs Container Card -->
		<div class="logs-card">
			<div class="logs-console" id="logsConsole">
				<div class="empty-placeholder">Loading archived logs...</div>
			</div>

			<!-- Pagination Controls -->
			<div class="pagination-bar">
				<div class="pagination-info" id="paginationInfo">
					Showing 0 of 0 entries (Page 1 of 1)
				</div>
				<div class="pagination-buttons">
					<button class="btn-nav" id="btnPrev" onclick="navigatePage(-1)" disabled>Previous</button>
					<button class="btn-nav" id="btnNext" onclick="navigatePage(1)" disabled>Next</button>
				</div>
			</div>
		</div>
	</main>

	<!-- Settings Dialog Overlay -->
	<div id="profileModal" class="modal-overlay" onclick="closeProfileModal(event)">
		<div class="modal-content" onclick="event.stopPropagation()">
			<div class="modal-header">
				<h3>Profile Settings</h3>
				<span class="close-btn" onclick="toggleModal(false)">&times;</span>
			</div>
			<div class="modal-body">
				<div class="profile-preview">
					<img id="modalAvatar" src="" alt="Avatar">
					<h4 id="modalUsername">Username</h4>
					<p id="modalRankText" class="modal-rank-soft-text"></p>
				</div>
				<div class="form-group-modal">
					<label for="rankSelect">Choose Display Rank</label>
					<select id="rankSelect" onchange="previewRankChange()">
						<!-- Options loaded dynamically -->
					</select>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-secondary" onclick="toggleModal(false)">Cancel</button>
				<button class="btn btn-primary" onclick="saveProfileConfig()">Save Changes</button>
			</div>
		</div>
	</div>

	<script>
		window.currentUser = null;
		let currentPage = 1;
		let totalPages = 1;
		let limit = 50;
		let expandedRows = new Set();
		let searchTimeout = null;

		const RANK_LABELS = {
			"bot dev": "bot dev",
			"den boundless resident": "den boundless resident",
			"den disciple echoing": "den disciple echoing",
			"den journeyer": "den journeyer",
			"den member": "den member",
			"member": "member"
		};

		function hideLoader() {
			const overlay = document.getElementById('loadingOverlay');
			if (overlay) overlay.classList.add('hidden');
		}

		// Initial profile check
		async function checkAuth() {
			try {
				const res = await fetch('/api/status');
				if (!res.ok) throw new Error();
				const data = await res.json();

				if (!data.user || !data.user.isAdmin) {
					window.location.href = '/dashboard';
					return;
				}

				window.currentUser = data.user;

				// Sidebar Profile Card
				const profileSection = document.getElementById('userProfileSection');
				const rankText = data.user.rankText ? ` <span class="rank-soft-text">${data.user.rankText}</span>` : '';

				profileSection.innerHTML = `
					<div class="user-card">
						<div class="user-details" onclick="openProfileModal()" style="cursor: pointer;">
							<img src="${data.user.avatarUrl}" alt="User Avatar" class="user-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
							<span class="user-name" title="${data.user.username}">${data.user.username}${rankText}</span>
						</div>
						<a href="/api/auth/logout" class="logout-btn" title="Logout" onclick="event.stopPropagation()">
							<svg style="width:16px;height:18px;fill:currentColor;" viewBox="0 0 24 24">
								<path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/>
							</svg>
						</a>
					</div>
				`;

				// Show admin links if qualified
				const adminOnlyItems = document.querySelectorAll('.admin-only');
				adminOnlyItems.forEach(el => el.style.display = 'block');

				// Populate sidebar bot info
				if (data.bot) {
					document.getElementById('botAvatar').src = data.bot.avatarUrl || 'https://cdn.discordapp.com/embed/avatars/0.png';
					document.getElementById('botTagName').textContent = data.bot.username || 'Fluffingiously';
					document.getElementById('sidebarStatusDot').className = `status-dot ${data.bot.status === 'online' ? 'online' : 'offline'}`;
				}

			} catch (e) {
				console.error('[LogsViewer] Failed authentication checks:', e);
				window.location.href = '/dashboard';
			}
		}

		// Fetch and render historical logs
		async function fetchLogData() {
			const consoleEl = document.getElementById('logsConsole');
			
			const type = document.getElementById('filterType').value;
			const method = document.getElementById('filterMethod').value;
			const statusCode = document.getElementById('filterStatus').value;
			const search = document.getElementById('searchQuery').value;

			const url = `/api/admin/api_logs?type=${type}&method=${method}&statusCode=${statusCode}&search=${encodeURIComponent(search)}&page=${currentPage}&limit=${limit}`;

			try {
				const res = await fetch(url);
				if (!res.ok) throw new Error('API server returned error code.');
				const data = await res.json();

				totalPages = data.totalPages || 1;
				const logs = data.logs || [];
				const total = data.total || 0;

				document.getElementById('btnPrev').disabled = currentPage <= 1;
				document.getElementById('btnNext').disabled = currentPage >= totalPages;

				const startEntry = total === 0 ? 0 : (currentPage - 1) * limit + 1;
				const endEntry = Math.min(currentPage * limit, total);
				document.getElementById('paginationInfo').textContent = 
					`Showing ${startEntry}-${endEntry} of ${total} entries (Page ${currentPage} of ${totalPages})`;

				if (logs.length === 0) {
					consoleEl.innerHTML = '<div class="empty-placeholder">No matching API logs found.</div>';
					return;
				}

				consoleEl.innerHTML = logs.map(req => {
					const date = new Date(req.timestamp);
					const dateStr = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
					const timeStr = date.toLocaleTimeString([], { hour12: false });
					const fullTimeStr = `${dateStr} ${timeStr}`;

					const methodStr = (req.method || 'GET').toUpperCase();
					let badgeMethodClass = 'badge-method-any';
					if (methodStr === 'GET') badgeMethodClass = 'badge-method-get';
					else if (methodStr === 'POST') badgeMethodClass = 'badge-method-post';
					else if (methodStr === 'PUT') badgeMethodClass = 'badge-method-put';
					else if (methodStr === 'DELETE') badgeMethodClass = 'badge-method-delete';

					let badgeStatusClass = 'status-pending';
					const status = req.statusCode;
					if (status === 'Pending') badgeStatusClass = 'status-pending';
					else if (status === 'Failed') badgeStatusClass = 'status-error';
					else if (status >= 200 && status < 300) badgeStatusClass = 'status-success';
					else if (status >= 300 && status < 400) badgeStatusClass = 'status-warning';
					else badgeStatusClass = 'status-error';

					const latencyStr = req.duration > 0 ? `${req.duration}ms` : (status === 'Pending' ? '...' : '<1ms');
					const pathName = req.path || '/';
					
					const ipStr = req.ip ? `<span class="log-badge badge-ip" style="background: rgba(255,255,255,0.07); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); font-size: 0.7rem; border-radius: 4px; padding: 1px 4px;">${req.ip}</span>` : '';
					const isExpanded = expandedRows.has(req.timestamp + '_' + req.path);

					// Formulate headers layout
					const formatHeaders = (headersObj) => {
						if (!headersObj || Object.keys(headersObj).length === 0) {
							return '<div class="header-line"><span style="color: var(--text-muted); italic">No headers tracked</span></div>';
						}
						return Object.entries(headersObj).map(([k, v]) => {
							return `<div class="header-line"><span class="header-key">${escapeHtml(k)}:</span> <span class="header-val">${escapeHtml(v)}</span></div>`;
						}).join('');
					};

					const reqHeadersHtml = formatHeaders(req.reqHeaders);
					const resHeadersHtml = formatHeaders(req.resHeaders);
					const errorMsgHtml = req.error ? `<div style="margin-top: 0.5rem; padding: 0.5rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 4px; color: var(--danger);"><strong>Error details:</strong> ${escapeHtml(req.error)}</div>` : '';

					return `
						<div class="log-row-container">
							<div class="log-row ${req.type}" onclick="toggleRowDetails('${req.timestamp}', '${pathName}')">
								<div class="log-left">
									<span class="log-badge ${badgeMethodClass}">${methodStr}</span>
									<span class="log-badge badge-type">${req.type}</span>
									${ipStr}
									<span class="log-path" title="${pathName}">${pathName}</span>
								</div>
								<div class="log-right">
									<span class="badge-status ${badgeStatusClass}">${status}</span>
									<span class="log-latency">${latencyStr}</span>
									<span class="log-time">${fullTimeStr}</span>
								</div>
							</div>
							<div id="details_${hashCode(req.timestamp + '_' + pathName)}" class="log-details" style="display: ${isExpanded ? 'block' : 'none'};">
								<div class="details-grid">
									<div>
										<div class="details-section-title">Request Headers</div>
										<div class="details-headers-box">${reqHeadersHtml}</div>
									</div>
									<div>
										<div class="details-section-title">Response Headers</div>
										<div class="details-headers-box">${resHeadersHtml}</div>
									</div>
								</div>
								${errorMsgHtml}
							</div>
						</div>
					`;
				}).join('');

			} catch (e) {
				console.error('[LogsViewer] Failed to load data:', e);
				consoleEl.innerHTML = `<div class="status-error" style="padding: 2rem; border-radius: 12px; background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.15); color: var(--danger)"><strong>Failed to load API log database:</strong> ${e.message}</div>`;
			}
		}

		function escapeHtml(str) {
			if (!str) return '';
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#039;');
		}

		function hashCode(str) {
			let hash = 0;
			for (let i = 0; i < str.length; i++) {
				const char = str.charCodeAt(i);
				hash = ((hash << 5) - hash) + char;
				hash = hash & hash; // Convert to 32bit integer
			}
			return Math.abs(hash);
		}

		function toggleRowDetails(timestamp, pathName) {
			const key = timestamp + '_' + pathName;
			const id = `details_${hashCode(key)}`;
			const el = document.getElementById(id);
			if (!el) return;

			if (expandedRows.has(key)) {
				expandedRows.delete(key);
				el.style.display = 'none';
			} else {
				expandedRows.add(key);
				el.style.display = 'block';
			}
		}

		function onFilterChange() {
			currentPage = 1;
			expandedRows.clear();
			fetchLogData();
		}

		function onSearchInput() {
			clearTimeout(searchTimeout);
			searchTimeout = setTimeout(() => {
				currentPage = 1;
				expandedRows.clear();
				fetchLogData();
			}, 350);
		}

		function navigatePage(dir) {
			const target = currentPage + dir;
			if (target >= 1 && target <= totalPages) {
				currentPage = target;
				fetchLogData();
			}
		}

		function refreshLogs() {
			fetchLogData();
		}

		// Modal Configuration Settings
		// Toggle display rank settings
		function toggleModal(show) {
			const modal = document.getElementById('profileModal');
			if (show) modal.classList.add('active');
			else modal.classList.remove('active');
		}

		function openProfileModal() {
			const user = window.currentUser;
			if (!user) return;

			document.getElementById('modalAvatar').src = user.avatarUrl;
			document.getElementById('modalUsername').textContent = user.username;
			document.getElementById('modalRankText').textContent = user.rankText || 'No custom rank active';

			const select = document.getElementById('rankSelect');
			select.innerHTML = '<option value="">None (Empty)</option>';

			if (user.eligibleRanks && user.eligibleRanks.length > 0) {
				user.eligibleRanks.forEach(rank => {
					const opt = document.createElement('option');
					opt.value = rank;
					opt.textContent = RANK_LABELS[rank] || rank;
					if (rank === user.displayRank) opt.selected = true;
					select.appendChild(opt);
				});
			} else {
				const opt = document.createElement('option');
				opt.value = "";
				opt.textContent = "No eligible ranks";
				opt.disabled = true;
				select.appendChild(opt);
			}

			toggleModal(true);
		}

		function closeProfileModal(event) {
			if (event && event.target === document.getElementById('profileModal')) {
				toggleModal(false);
			}
		}

		function previewRankChange() {
			const select = document.getElementById('rankSelect');
			const chosen = select.value;
			document.getElementById('modalRankText').textContent = chosen ? (RANK_LABELS[chosen] || '') : 'None (Empty)';
		}

		async function saveProfileConfig() {
			const select = document.getElementById('rankSelect');
			const chosenRank = select.value;

			try {
				const res = await fetch('/api/user/config', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ displayRank: chosenRank })
				});

				if (!res.ok) throw new Error('Failed to save settings');
				toggleModal(false);
				await checkAuth();
			} catch (e) {
				alert('Error saving rank choice: ' + e.message);
			}
		}

		(async function init() {
			await checkAuth();
			await fetchLogData();
			hideLoader();
		})();
	</script>
</body>
